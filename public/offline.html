<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Sem conexão · Recepção</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
        background: #ffffff; color: #0f1b2d;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 340px; text-align: center; }
      img { width: 44px; height: 44px; }
      h1 { margin: 24px 0 6px; font-size: 20px; font-weight: 600; color: #0b2545; letter-spacing: -0.01em; }
      p { margin: 0; font-size: 14px; line-height: 1.55; color: #5b6878; }
      button {
        margin-top: 24px; height: 46px; padding: 0 20px; border: 0; border-radius: 8px;
        background: #0b2545; color: #fff; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer;
      }
      button:hover { background: #13345e; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon.svg" alt="" />
      <h1>Você está sem conexão</h1>
      <p>O Recepção precisa de internet para acessar e salvar os cadastros com segurança. Verifique sua conexão.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
